name: Apply order modal improvements

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-order-modal-operational-improvements.py
      - scripts/apply-order-modal-operational-improvements.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply improvements
        run: |
          set +e
          python scripts/apply-order-modal-operational-improvements.py > /tmp/order-modal-patch.log 2>&1
          status=$?
          cat /tmp/order-modal-patch.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/order-modal-patch.log scripts/apply-order-modal-operational-improvements.error.log
          else
            rm -f scripts/apply-order-modal-operational-improvements.error.log
          fi
          exit 0

      - name: Commit changes or diagnostics
        run: |
          git config user.name "vento-orders-bot"
          git config user.email "orders-bot@ventogroup.co"
          git add -A src/app/orders/page.tsx src/app/orders/orders-board.tsx scripts/apply-order-modal-operational-improvements.error.log 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ -f scripts/apply-order-modal-operational-improvements.error.log ]; then
            git commit -m "chore: record order modal patch error"
          else
            git commit -m "feat(orders): improve delivery detail and price breakdown"
          fi
          git push origin HEAD:main
